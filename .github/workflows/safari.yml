name: Safari CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safari-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm compile

      - name: Lint and format check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build native Safari app
        run: pnpm build:safari:app

      - name: Archive native Safari app
        run: ditto -c -k --sequesterRsrc --keepParent ".output/safari-derived/Build/Products/Debug/Assign Watch.app" .output/assign-watch-safari-macos.zip

      - name: Upload native Safari app artifact
        uses: actions/upload-artifact@v7
        with:
          name: assign-watch-safari-${{ github.sha }}
          path: .output/assign-watch-safari-macos.zip
          if-no-files-found: error
          retention-days: 30
